  :root {
    /* Theme „panel“ (Standard): passend zur Programm-Tafel im Stream.
       Schiefertafel, Eisenrahmen mit Nieten, bernsteinfarbenes Leuchtschild, cremefarbene Serifenschrift. */
    --font-body: 'CheckTalk Slab', Rockwell, 'Courier New', serif;
    --font-head: 'CheckTalk Stencil', Bahnschrift, 'Arial Narrow', sans-serif;
    --body-weight: 700;
    --head-spacing: 0.07em;
    --plate: rgba(30, 33, 33, 0.84);
    --plate-solid: #1e2121;   /* deckend: Platte ohne Durchsicht */
    --backdrop: #000000;      /* deckend: Füllung der ganzen Quelle */
    --frame: #3d3730;
    --frame-line: rgba(176, 140, 84, 0.55);
    --rivet: radial-gradient(circle at 35% 35%, #9a8a72 0 18%, #4a4036 45%, transparent 55%);
    --head-bg: rgba(20, 17, 14, 0.9);
    --head-color: #f7b44a;
    --head-glow: 0 0 0.25em rgba(255, 158, 40, 0.75), 0 0 0.05em rgba(255, 200, 120, 0.9);
    --rule: rgba(232, 220, 196, 0.75);
    --text: #e8dcc4;
    --text-shadow: 0 0.05em 0.08em rgba(0, 0, 0, 0.85);
    --box: #b08a4a;
    --box-active: #f7b44a;
    --box-active-glow: 0 0 0.3em rgba(255, 158, 40, 0.8);
    --box-done-bg: rgba(176, 138, 74, 0.25);
    --check: #f7b44a;
    --open: 0.62;      /* offen: halbtransparent */
    --active: 1;       /* aktiv: voll */
    --done: 0.55;      /* erledigt: zurückgenommen */
    --done-text: #8e877b; /* erledigt: ausgegraut */
    --fade-in: 600ms;
    --fade-out-manual: 600ms;
    --fade-out-auto: 1600ms;
    --step: 450ms;
  }
  :root[data-theme="spargel"] {
    /* wie SpargelPoll: Impact, Grün #4a7c23, weiße Schrift mit schwarzer Kontur */
    --font-body: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
    --font-head: var(--font-body);
    --body-weight: 400;
    --head-spacing: 0.06em;
    --plate: rgba(0, 0, 0, 0.6);
    --plate-solid: #111111;
    --frame: #4a7c23;
    --frame-line: transparent;
    --rivet: none;
    --head-bg: transparent;
    --head-color: #7bc043;
    --head-glow: 2px 2px 0 #000;
    --rule: transparent;
    --text: #ffffff;
    --text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    --box: #ffffff;
    --box-active: #7bc043;
    --box-active-glow: none;
    --box-done-bg: #4a7c23;
    --check: #ffffff;
    --done-text: #b4b4b4;
  }
  :root[data-theme="neutral"] {
    --font-body: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    --font-head: var(--font-body);
    --body-weight: 600;
    --head-spacing: 0.08em;
    --plate: rgba(0, 0, 0, 0.45);
    --plate-solid: #161616;
    --frame: transparent;
    --frame-line: transparent;
    --rivet: none;
    --head-bg: transparent;
    --head-color: rgba(255, 255, 255, 0.85);
    --head-glow: 0 1px 3px rgba(0, 0, 0, 0.8);
    --rule: rgba(255, 255, 255, 0.4);
    --text: #ffffff;
    --text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    --box: rgba(255, 255, 255, 0.85);
    --box-active: #ffffff;
    --box-active-glow: none;
    --box-done-bg: rgba(255, 255, 255, 0.25);
    --check: #ffffff;
    --done-text: #b4b4b4;
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    font-family: var(--font-body);
    font-weight: var(--body-weight);
    /* Schrift folgt der Größe der Browserquelle: ein Design für horizontal und vertikal */
    font-size: calc(clamp(16px, min(5.2vw, 7vh), 72px) * var(--scale, 1));
  }
  /* Bühne = ganze Browserquelle. Sie blendet ein und aus; deckend füllt sie die Quelle und überdeckt, was darunter liegt. */
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    padding: 2vmin;
    box-sizing: border-box;
    opacity: 0;
    transition: opacity var(--fade-in) ease;
  }
  .stage.visible { opacity: 1; }
  .stage.hiding-auto { transition-duration: var(--fade-out-auto); }
  .stage.hiding-manual { transition-duration: var(--fade-out-manual); }
  :root[data-background="solid"] .stage { background: var(--backdrop); }
  :root[data-background="solid"] .plate { background: var(--plate-solid); }
  body[data-anchor="tl"] .stage { align-items: flex-start; justify-content: flex-start; }
  body[data-anchor="tr"] .stage { align-items: flex-start; justify-content: flex-end; }
  body[data-anchor="bl"] .stage { align-items: flex-end;   justify-content: flex-start; }
  body[data-anchor="br"] .stage { align-items: flex-end;   justify-content: flex-end; }
  body[data-anchor="c"]  .stage { align-items: center;     justify-content: center; }

  .plate {
    position: relative;
    background: var(--plate);
    border: 0.16em solid var(--frame);
    box-shadow: inset 0 0 0 0.04em var(--frame-line), 0 0.1em 0.4em rgba(0, 0, 0, 0.5);
    border-radius: 0.35em;
    padding: 0.5em 0.95em 0.6em 0.85em;
    max-width: 100%;
    box-sizing: border-box;
  }
  .plate::before {
    /* Nieten in den Ecken (statisch) */
    content: '';
    position: absolute;
    inset: 0.12em;
    pointer-events: none;
    background:
      var(--rivet) left top / 0.32em 0.32em no-repeat,
      var(--rivet) right top / 0.32em 0.32em no-repeat,
      var(--rivet) left bottom / 0.32em 0.32em no-repeat,
      var(--rivet) right bottom / 0.32em 0.32em no-repeat;
  }

  .heading {
    display: block;
    width: fit-content;
    margin: 0 auto 0.3em;
    padding: 0.12em 0.6em 0.08em;
    background: var(--head-bg);
    border-radius: 0.15em;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 0.74em;
    letter-spacing: var(--head-spacing);
    text-transform: uppercase;
    color: var(--head-color);
    text-shadow: var(--head-glow);
  }
  .heading::after {
    /* Trennlinie wie auf der Programm-Tafel */
    content: '';
    display: block;
    height: 0.06em;
    margin: 0.45em -0.6em -0.35em;
    background: var(--rule);
  }
  ol {
    list-style: none;
    margin: 0.35em 0 0;
    padding: 0;
  }
  li {
    display: flex;
    align-items: center;
    gap: 0.45em;
    padding: 0.1em 0;
    color: var(--text);
    text-shadow: var(--text-shadow);
    opacity: var(--open);
    transition: opacity var(--step) ease;
  }
  li[data-status="aktiv"]    { opacity: var(--active); }
  li[data-status="erledigt"] { opacity: var(--done); }

  .box {
    flex: none;
    width: 0.66em;
    height: 0.66em;
    border: 0.08em solid var(--box);
    border-radius: 0.12em;
    position: relative;
    transition: background-color var(--step) ease, border-color var(--step) ease, box-shadow var(--step) ease;
  }
  li[data-status="aktiv"] .box { border-color: var(--box-active); box-shadow: var(--box-active-glow); }
  li[data-status="erledigt"] .box { background: var(--box-done-bg); }
  .box::after {
    /* Haken */
    content: '';
    position: absolute;
    left: 0.19em;
    top: 0.01em;
    width: 0.19em;
    height: 0.38em;
    border: solid var(--check);
    border-width: 0 0.08em 0.08em 0;
    transform: rotate(45deg) scale(0);
    transform-origin: center;
    transition: transform var(--step) ease;
  }
  li[data-status="erledigt"] .box::after { transform: rotate(45deg) scale(1); }

  .title {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    transition: color var(--step) ease;
  }
  /* erledigt: nur abgehakt und ausgegraut, nicht durchgestrichen */
  li[data-status="erledigt"] .title { color: var(--done-text); }

  .diag {
    position: fixed;
    left: 8px;
    bottom: 6px;
    max-width: calc(100% - 16px);
    font: 16px/1.4 system-ui, sans-serif;
    color: #fff;
    background: rgba(160, 20, 20, 0.85);
    padding: 6px 10px;
    border-radius: 4px;
    z-index: 10;
    white-space: pre-wrap;
  }
  .diag.ok { background: rgba(20, 110, 40, 0.85); }
  .demo-help {
    position: fixed;
    right: 8px;
    bottom: 6px;
    font: 12px/1.4 system-ui, sans-serif;
    color: #fff;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 8px;
    border-radius: 4px;
  }
</style>
</head>
<body data-anchor="tl">
  <div class="stage" id="stage">
    <div class="plate" aria-live="polite">
      <div class="heading" id="heading">Tagesthemen</div>
      <ol id="list"></ol>
    </div>
  </div>

<script>
'use strict';
const WIDGET_VERSION = '0.2.1';

// ── Einstellungen ──
// Überschrift, Design und Hintergrund kommen vom Server (Webkonsole, Reiter „Topics“).
// URL-Parameter überschreiben sie nur für diese eine Quelle; `output` wählt, welcher Hintergrund gilt.
const params = new URLSearchParams(location.search);
const SERVER = (params.get('server') || 'http://localhost:3000').replace(/\/$/, '');
const DEMO = params.get('demo') === '1';
const OUTPUT = params.get('output') === 'vertikal' ? 'vertikal' : 'horizontal';
const THEMES = ['panel', 'spargel', 'neutral'];
const BACKGROUNDS = ['transparent', 'solid'];
const AUTO_HIDE_MS = 5000; // nur im Demo-Modus; im Betrieb blendet der Server aus
const DEFAULT_DISPLAY = { title: 'Tagesthemen', theme: 'panel', background: { horizontal: 'transparent', vertikal: 'solid' } };

const scale = parseFloat(params.get('scale'));
if (scale >= 0.5 && scale <= 2) document.documentElement.style.setProperty('--scale', String(scale));
const anchor = params.get('anchor');
if (['tl', 'tr', 'bl', 'br', 'c'].includes(anchor)) document.body.dataset.anchor = anchor;

const stage = document.getElementById('stage');
const heading = document.getElementById('heading');
const list = document.getElementById('list');
let lastRevision = -1;
let renderedTitles = '';

function applyDisplay(display = DEFAULT_DISPLAY) {
  const theme = params.get('theme') || display.theme;
  const background = params.get('background') || (display.background && display.background[OUTPUT]);
  const title = params.has('title') ? params.get('title') : display.title;
  document.documentElement.dataset.theme = THEMES.includes(theme) ? theme : 'panel';
  document.documentElement.dataset.background = BACKGROUNDS.includes(background) ? background : 'transparent';
  heading.textContent = title || '';
  heading.hidden = !title;
}

// ── Anzeige: setzt nur Klassen/Attribute, damit CSS-Übergänge greifen ──
function render(state) {
  if (typeof state.revision === 'number') {
    if (state.revision <= lastRevision) return;
    lastRevision = state.revision;
  }
  applyDisplay(state.display);
  const titles = JSON.stringify(state.items.map(i => i.title));
  if (titles !== renderedTitles) {
    list.replaceChildren(...state.items.map(item => {
      const li = document.createElement('li');
      const box = document.createElement('span');
      box.className = 'box';
      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = item.title;
      li.append(box, title);
      return li;
    }));
    renderedTitles = titles;
  }
  state.items.forEach((item, i) => { list.children[i].dataset.status = item.status; });

  const show = Boolean(state.enabled !== false && state.visible && state.items.length);
  stage.classList.toggle('hiding-auto', !show && state.hide_reason === 'auto');
  stage.classList.toggle('hiding-manual', !show && state.hide_reason !== 'auto');
  stage.classList.toggle('visible', show);
}

function hideBecauseOffline() {
  stage.classList.remove('visible', 'hiding-auto');
  stage.classList.add('hiding-manual');
}

// ── Betrieb: Zustand vom Server per Server-Sent Events (Spec intro-topics.md) ──
// ── Diagnose (?debug=1): zeigt in der Quelle, ob und wie das Widget den Server erreicht ──
const DEBUG = params.get('debug') === '1';
let diagBox = null;
function diag(text, ok = false) {
  if (!DEBUG) return;
  if (!diagBox) { diagBox = document.createElement('div'); diagBox.className = 'diag'; document.body.append(diagBox); }
  diagBox.textContent = `CheckTalk ${WIDGET_VERSION} · ${text}`;
  diagBox.classList.toggle('ok', ok);
}

function diagnoseFailure() {
  if (location.protocol !== 'file:') {
    return `Seite geladen über „${location.protocol}//${location.host}“. In OBS „Lokale Datei“ ausschalten und die Datei als URL file:///C:/… eintragen (neuere OBS-Versionen sperren sonst den Zugriff auf localhost).`;
  }
  // Prüfen, ob der Server überhaupt antwortet (gleiche Adresse, normale Anfrage statt Events)
  fetch(`${SERVER}/api/topics`, { cache: 'no-store' })
    .then(r => diag(r.ok ? `Server antwortet auf /api/topics, aber der Event-Stream bricht ab (HTTP ${r.status}). Server neu starten?` : `Server antwortet mit HTTP ${r.status} auf ${SERVER}/api/topics.${r.status === 404 ? ' Läuft eine alte Server-Version ohne Intro-Topics?' : ''}${r.status === 403 ? ' Zugriff abgelehnt: Server-Konsole prüfen ([Zugriffsschutz]).' : ''}`))
    .catch(() => diag(`Server nicht erreichbar: ${SERVER}. Läuft der Server, stimmt der Port? Sonst blockiert OBS die Anfrage (Konsole der Quelle über --remote-debugging-port prüfen).`));
  return `Keine Verbindung zu ${SERVER}/api/topics/stream – prüfe …`;
}

function connect() {
  diag(`verbinde mit ${SERVER} (Seite: ${location.protocol}//${location.host || ''})`);
  const source = new EventSource(`${SERVER}/api/topics/stream`);
  source.onopen = () => diag(`verbunden mit ${SERVER}, Ausgabe ${OUTPUT}`, true);
  source.addEventListener('state', ev => {
    try {
      const state = JSON.parse(ev.data);
      render(state);
      diag(`verbunden · Ausgabe ${OUTPUT} · ${state.enabled === false ? 'Modul AUS' : state.visible ? 'sichtbar' : 'ausgeblendet'} · Schritt ${state.step}/${2 * state.total}`, true);
    } catch (err) {
      console.warn('[CheckTalk] Ungültiger Zustand', err);
      diag(`Ungültige Daten vom Server: ${err.message}`);
    }
  });
  source.onerror = () => {
    // EventSource verbindet selbst neu (retry vom Server); bis dahin nichts zeigen
    hideBecauseOffline();
    lastRevision = -1;
    diag(diagnoseFailure());
  };
}

// ── Demo-Modus: gleiche Schrittlogik wie lib/topics.js im Server, Bedienung per Tastatur ──
function demo() {
  const titles = (params.get('items') || 'Neuigkeiten|Streamplan|Community|Heute im Spiel').split('|').filter(Boolean);
  let step = 0, visible = false, hideReason = null, revision = 0, timer = null;

  const complete = () => step === 2 * titles.length;
  const statusOf = i => step < 2 * i + 1 ? 'offen' : step === 2 * i + 1 ? 'aktiv' : 'erledigt';
  const emit = () => render({
    enabled: true, visible, hide_reason: hideReason, step, total: titles.length, display: DEFAULT_DISPLAY,
    items: titles.map((title, i) => ({ title, status: statusOf(i) })), revision: ++revision
  });
  const stopTimer = () => { clearTimeout(timer); timer = null; };
  const show = () => { visible = true; hideReason = null; };

  const actions = {
    next() {
      if (visible && complete()) return false;   // fertig: nichts ändern, Ausblend-Timer läuft weiter
      stopTimer();
      if (!visible) return show();
      step++;
      if (complete()) timer = setTimeout(() => { visible = false; hideReason = 'auto'; emit(); }, AUTO_HIDE_MS);
    },
    back() {
      stopTimer();
      if (!visible) return show();
      if (step > 0) step--;
    },
    toggle() {
      stopTimer();
      if (visible) { visible = false; hideReason = 'manual'; } else show();
    },
    reset() { stopTimer(); step = 0; visible = false; hideReason = 'manual'; }
  };
  const keys = { n: 'next', ArrowRight: 'next', ' ': 'next', b: 'back', ArrowLeft: 'back', h: 'toggle', r: 'reset' };
  document.addEventListener('keydown', ev => {
    const action = keys[ev.key];
    if (!action) return;
    ev.preventDefault();
    if (actions[action]() !== false) emit();
  });
  const help = document.createElement('div');
  help.className = 'demo-help';
  help.textContent = `Demo ${WIDGET_VERSION} · N/→/Leertaste weiter · B/← zurück · H ein/aus · R reset`;
  document.body.append(help);
  emit();
}

if (DEMO) demo(); else connect();
</script>
</body>
</html>
