<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CheckTalk</title>
<style>
  :root {
    /* Theme „panel“ (Standard): passend zur Programm-Tafel im Stream.
       Schiefertafel, Eisenrahmen mit Nieten, bernsteinfarbenes Leuchtschild, cremefarbene Serifenschrift. */
    --font-body: Rockwell, 'Roboto Slab', 'Courier New', serif;
    --font-head: Bahnschrift, 'Arial Narrow', 'Roboto Condensed', sans-serif;
    --head-stretch: 75%;
    --plate: rgba(30, 33, 33, 0.84);
    --frame: #3d3730;
    --frame-line: rgba(176, 140, 84, 0.55);
    --rivet: radial-gradient(circle at 35% 35%, #9a8a72 0 18%, #4a4036 45%, transparent 55%);
    --head-bg: rgba(20, 17, 14, 0.9);
    --head-color: #f7b44a;
    --head-glow: 0 0 0.25em rgba(255, 158, 40, 0.75), 0 0 0.05em rgba(255, 200, 120, 0.9);
    --rule: rgba(232, 220, 196, 0.75);
    --text: #e8dcc4;
    --text-shadow: 0 0.05em 0.08em rgba(0, 0, 0, 0.85);
    --box: #b08a4a;
    --box-active: #f7b44a;
    --box-active-glow: 0 0 0.3em rgba(255, 158, 40, 0.8);
    --box-done-bg: rgba(176, 138, 74, 0.25);
    --check: #f7b44a;
    --open: 0.62;      /* offen: halbtransparent */
    --active: 1;       /* aktiv: voll */
    --done: 0.55;      /* erledigt: zurückgenommen */
    --done-text: #8e877b; /* erledigt: ausgegraut */
    --fade-in: 600ms;
    --fade-out-manual: 600ms;
    --fade-out-auto: 1600ms;
    --step: 450ms;
  }
  :root[data-theme="spargel"] {
    /* wie SpargelPoll: Impact, Grün #4a7c23, weiße Schrift mit schwarzer Kontur */
    --font-body: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
    --font-head: var(--font-body);
    --head-stretch: 100%;
    --plate: rgba(0, 0, 0, 0.6);
    --frame: #4a7c23;
    --frame-line: transparent;
    --rivet: none;
    --head-bg: transparent;
    --head-color: #7bc043;
    --head-glow: 2px 2px 0 #000;
    --rule: transparent;
    --text: #ffffff;
    --text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    --box: #ffffff;
    --box-active: #7bc043;
    --box-active-glow: none;
    --box-done-bg: #4a7c23;
    --check: #ffffff;
    --done-text: #b4b4b4;
  }
  :root[data-theme="neutral"] {
    --font-body: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    --font-head: var(--font-body);
    --head-stretch: 100%;
    --plate: rgba(0, 0, 0, 0.45);
    --frame: transparent;
    --frame-line: transparent;
    --rivet: none;
    --head-bg: transparent;
    --head-color: rgba(255, 255, 255, 0.85);
    --head-glow: 0 1px 3px rgba(0, 0, 0, 0.8);
    --rule: rgba(255, 255, 255, 0.4);
    --text: #ffffff;
    --text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    --box: rgba(255, 255, 255, 0.85);
    --box-active: #ffffff;
    --box-active-glow: none;
    --box-done-bg: rgba(255, 255, 255, 0.25);
    --check: #ffffff;
    --done-text: #b4b4b4;
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    display: flex;
    padding: 2vmin;
    box-sizing: border-box;
    font-family: var(--font-body);
    /* Schrift folgt der Größe der Browserquelle: ein Design für horizontal und vertikal */
    font-size: clamp(16px, min(5.2vw, 7vh), 72px);
  }
  body[data-anchor="tl"] { align-items: flex-start; justify-content: flex-start; }
  body[data-anchor="tr"] { align-items: flex-start; justify-content: flex-end; }
  body[data-anchor="bl"] { align-items: flex-end;   justify-content: flex-start; }
  body[data-anchor="br"] { align-items: flex-end;   justify-content: flex-end; }
  body[data-anchor="c"]  { align-items: center;     justify-content: center; }

  .plate {
    position: relative;
    background: var(--plate);
    border: 0.16em solid var(--frame);
    box-shadow: inset 0 0 0 0.04em var(--frame-line), 0 0.1em 0.4em rgba(0, 0, 0, 0.5);
    border-radius: 0.35em;
    padding: 0.5em 0.95em 0.6em 0.85em;
    max-width: 100%;
    box-sizing: border-box;
    opacity: 0;
    transition: opacity var(--fade-in) ease;
  }
  .plate::before {
    /* Nieten in den Ecken (statisch) */
    content: '';
    position: absolute;
    inset: 0.12em;
    pointer-events: none;
    background:
      var(--rivet) left top / 0.32em 0.32em no-repeat,
      var(--rivet) right top / 0.32em 0.32em no-repeat,
      var(--rivet) left bottom / 0.32em 0.32em no-repeat,
      var(--rivet) right bottom / 0.32em 0.32em no-repeat;
  }
  .plate.visible { opacity: 1; }
  .plate.hiding-auto { transition-duration: var(--fade-out-auto); }
  .plate.hiding-manual { transition-duration: var(--fade-out-manual); }

  .heading {
    display: block;
    width: fit-content;
    margin: 0 auto 0.3em;
    padding: 0.12em 0.6em 0.08em;
    background: var(--head-bg);
    border-radius: 0.15em;
    font-family: var(--font-head);
    font-stretch: var(--head-stretch);
    font-weight: 600;
    font-size: 0.66em;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--head-color);
    text-shadow: var(--head-glow);
  }
  .heading::after {
    /* Trennlinie wie auf der Programm-Tafel */
    content: '';
    display: block;
    height: 0.06em;
    margin: 0.45em -0.6em -0.35em;
    background: var(--rule);
  }
  ol {
    list-style: none;
    margin: 0.35em 0 0;
    padding: 0;
  }
  li {
    display: flex;
    align-items: center;
    gap: 0.45em;
    padding: 0.1em 0;
    color: var(--text);
    text-shadow: var(--text-shadow);
    opacity: var(--open);
    transition: opacity var(--step) ease;
  }
  li[data-status="aktiv"]    { opacity: var(--active); }
  li[data-status="erledigt"] { opacity: var(--done); }

  .box {
    flex: none;
    width: 0.66em;
    height: 0.66em;
    border: 0.08em solid var(--box);
    border-radius: 0.12em;
    position: relative;
    transition: background-color var(--step) ease, border-color var(--step) ease, box-shadow var(--step) ease;
  }
  li[data-status="aktiv"] .box { border-color: var(--box-active); box-shadow: var(--box-active-glow); }
  li[data-status="erledigt"] .box { background: var(--box-done-bg); }
  .box::after {
    /* Haken */
    content: '';
    position: absolute;
    left: 0.19em;
    top: 0.01em;
    width: 0.19em;
    height: 0.38em;
    border: solid var(--check);
    border-width: 0 0.08em 0.08em 0;
    transform: rotate(45deg) scale(0);
    transform-origin: center;
    transition: transform var(--step) ease;
  }
  li[data-status="erledigt"] .box::after { transform: rotate(45deg) scale(1); }

  .title {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    transition: color var(--step) ease;
  }
  /* erledigt: nur abgehakt und ausgegraut, nicht durchgestrichen */
  li[data-status="erledigt"] .title { color: var(--done-text); }

  .demo-help {
    position: fixed;
    right: 8px;
    bottom: 6px;
    font: 12px/1.4 system-ui, sans-serif;
    color: #fff;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 8px;
    border-radius: 4px;
  }
</style>
</head>
<body data-anchor="tl">
  <div class="plate" id="plate" aria-live="polite">
    <div class="heading" id="heading">Topics of the day</div>
    <ol id="list"></ol>
  </div>

<script>
'use strict';
const WIDGET_VERSION = '0.1.0';

// ── Einstellungen per URL-Parameter ──
const params = new URLSearchParams(location.search);
const SERVER = (params.get('server') || 'http://localhost:3000').replace(/\/$/, '');
const DEMO = params.get('demo') === '1';
const AUTO_HIDE_MS = 5000; // nur im Demo-Modus; im Betrieb blendet der Server aus

const THEMES = ['panel', 'spargel', 'neutral'];
document.documentElement.dataset.theme = THEMES.includes(params.get('theme')) ? params.get('theme') : 'panel';
const anchor = params.get('anchor');
if (['tl', 'tr', 'bl', 'br', 'c'].includes(anchor)) document.body.dataset.anchor = anchor;
if (params.has('title')) document.getElementById('heading').textContent = params.get('title');
if (params.get('title') === '') document.getElementById('heading').hidden = true;

const plate = document.getElementById('plate');
const list = document.getElementById('list');
let lastRevision = -1;
let renderedTitles = '';

// ── Anzeige: setzt nur Klassen/Attribute, damit CSS-Übergänge greifen ──
function render(state) {
  if (typeof state.revision === 'number') {
    if (state.revision <= lastRevision && state.revision !== 0) return;
    lastRevision = state.revision;
  }
  const titles = JSON.stringify(state.items.map(i => i.title));
  if (titles !== renderedTitles) {
    list.replaceChildren(...state.items.map(item => {
      const li = document.createElement('li');
      const box = document.createElement('span');
      box.className = 'box';
      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = item.title;
      li.append(box, title);
      return li;
    }));
    renderedTitles = titles;
  }
  state.items.forEach((item, i) => { list.children[i].dataset.status = item.status; });

  const show = Boolean(state.enabled !== false && state.visible && state.items.length);
  plate.classList.toggle('hiding-auto', !show && state.hide_reason === 'auto');
  plate.classList.toggle('hiding-manual', !show && state.hide_reason !== 'auto');
  plate.classList.toggle('visible', show);
}

function hideBecauseOffline() {
  plate.classList.remove('visible', 'hiding-auto');
  plate.classList.add('hiding-manual');
}

// ── Betrieb: Zustand vom Server per Server-Sent Events (Spec intro-topics.md) ──
function connect() {
  const source = new EventSource(`${SERVER}/api/topics/stream`);
  source.addEventListener('state', ev => {
    try { render(JSON.parse(ev.data)); } catch (err) { console.warn('[CheckTalk] Ungültiger Zustand', err); }
  });
  source.onerror = () => {
    // EventSource verbindet selbst neu (retry vom Server); bis dahin nichts zeigen
    hideBecauseOffline();
    lastRevision = -1;
  };
}

// ── Demo-Modus: gleiche Schrittlogik wie der Server, Bedienung per Tastatur ──
function demo() {
  const titles = (params.get('items') || 'Neuigkeiten|Streamplan|Community|Heute im Spiel').split('|').filter(Boolean);
  let step = 0, visible = false, hideReason = null, revision = 0, timer = null;

  const statusOf = i => step < 2 * i + 1 ? 'offen' : step === 2 * i + 1 ? 'aktiv' : 'erledigt';
  const emit = () => render({
    enabled: true, visible, hide_reason: hideReason, step, total: titles.length,
    items: titles.map((title, i) => ({ title, status: statusOf(i) })), revision: ++revision
  });
  const stopTimer = () => { clearTimeout(timer); timer = null; };
  const show = () => { visible = true; hideReason = null; };

  const actions = {
    next() {
      stopTimer();
      if (!visible) return show();
      if (step < 2 * titles.length) step++;
      if (step === 2 * titles.length) {
        timer = setTimeout(() => { visible = false; hideReason = 'auto'; emit(); }, AUTO_HIDE_MS);
      }
    },
    back() {
      stopTimer();
      if (!visible) return show();
      if (step > 0) step--;
    },
    toggle() {
      stopTimer();
      if (visible) { visible = false; hideReason = 'manual'; } else show();
    },
    reset() { stopTimer(); step = 0; visible = false; hideReason = 'manual'; }
  };
  const keys = { n: 'next', ArrowRight: 'next', ' ': 'next', b: 'back', ArrowLeft: 'back', h: 'toggle', r: 'reset' };
  document.addEventListener('keydown', ev => {
    const action = keys[ev.key];
    if (!action) return;
    ev.preventDefault();
    actions[action]();
    emit();
  });

  const help = document.createElement('div');
  help.className = 'demo-help';
  help.textContent = `Demo ${WIDGET_VERSION} · N/→/Leertaste weiter · B/← zurück · H ein/aus · R reset`;
  document.body.append(help);
  emit();
}

if (DEMO) demo(); else connect();
</script>
</body>
</html>
